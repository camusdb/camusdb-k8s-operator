# This rule is not used by the project camusdb-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to camusdb.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: camusdb-operator
    app.kubernetes.io/managed-by: kustomize
  name: camusdbcluster-viewer-role
rules:
- apiGroups:
  - camusdb.io
  resources:
  - camusdbclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - camusdb.io
  resources:
  - camusdbclusters/status
  verbs:
  - get
